<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="stylesheet" href="style.css">
    <script src="jquery-4.0.0.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div id="header">
        <div id="header-text">Validator</div>
    </div>
    <div id="main-content-area">
        <div id="basic-explanation">
            <div id="list-board">
                <label id="email-label">Enter your email</label>
                <input id="email" type="email" required>
                <label id="password-label">Enter your password</label>
                <input id="password" type="password" required minlength="8"><br>
                <div id="show-error"></div>
            </div>
        </div>
    </div>
</body>
</html>
