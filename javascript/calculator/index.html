<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <div class="calculator-display-area">
            <input id="calculator-display" type="text" readonly>
        </div>
        <div class="calculator-button-area">
            <div class="calculator-buttons">
                <button onclick="digitButton('7')" id="7">7</button>
                <button onclick="digitButton('8')" id="8">8</button>
                <button onclick="digitButton('9')" id="9">9</button>
                <button onclick="operatorButton('*')" id="*">*</button>
                <button onclick="digitButton('4')" id="4">4</button>
                <button onclick="digitButton('5')" id="5">5</button>
                <button onclick="digitButton('6')" id="6">6</button>
                <button onclick="operatorButton('-')" id="-">-</button>
                <button onclick="digitButton('1')" id="1">1</button>
                <button onclick="digitButton('2')" id="2">2</button>
                <button onclick="digitButton('3')" id="3">3</button>
                <button onclick="operatorButton('+')" id="+">+</button>
                <button onclick="operatorButton('/')" id="/">/</button>
                <button onclick="digitButton('0')" id="0">0</button>
                <button onclick="buttonClearLast()" id="C">C</button>
                <button onclick="equalsButton('=')" id="=">=</button>
            </div>
        </div>
    </div>
</body>
</html>
