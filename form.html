<!DOCTYPE html>
<link rel="stylesheet" href="style.css">
<html>
    <head>
        <title>Form</title>
    </head>
    <body>
        <form>
            <label>Full Name:</label>
            <input type="text">
            <br>
            <label>Age:</label>
            <input type="number">
            <br>
            <label>Email:</label>
            <input type="email">
            <br>
            <label>Gender:</label>
            <input type="radio">
            <label>Male</label>
            <input type="radio">
            <label>Female</label>
            <br>
            <label>Qualification:</label>
            <select>
                <option>Choose</option>
                <option>+2</option>
                <option>BCA</option>
                <option>MCA</option>
            </select>
            <br>
            <label>Skills:</label><br>
            <label>HTML</label>
            <input type="checkbox">
            <label>CSS</label>
            <input type="checkbox">
            <label>Javascript</label>
            <input type="checkbox">
            <br>
            <input type="submit" value="Submit Form">
        </form>
    </body>
</html>
